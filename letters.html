<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open this when you…</title>
<link rel="stylesheet" href="style.css">
<style>
  .header{
    position:sticky; top:0; z-index:10;
    background: linear-gradient(180deg, var(--cream) 78%, transparent);
    padding: 50px 6vw 22px;
    text-align:center;
  }
  .header h1{
    font-family: 'Alex Brush', cursive;
    font-weight:400;
    font-size: clamp(2.6rem, 6vw, 3.6rem);
    color: var(--accent-deep);
    margin-bottom: 22px;
    letter-spacing: 0.01em;
  }
  .search{
    max-width:460px; margin:0 auto;
    display:flex; align-items:center; gap:12px;
    border: 1px solid var(--line-soft);
    border-radius: 999px;
    padding: 12px 22px;
    background:#fff;
  }
  .search svg{ width:18px; height:18px; flex-shrink:0; }
  .search input{
    flex:1; border:none; outline:none;
    font-family:'Poppins', sans-serif;
    font-style:italic; font-size:0.9rem;
    color: var(--ink);
  }
  .search input::placeholder{ color:#B8A99B; }

  .grid{
    max-width: 1040px; margin:0 auto;
    padding: 24px 6vw 100px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 34px 26px;
  }
  @media (max-width: 760px){ .grid{ grid-template-columns: repeat(2,1fr); gap:24px 16px; } }

  .env-card{
    background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    transition: transform .18s ease;
  }
  .env-card:hover{ transform: translateY(-4px); }
  .env-card svg{ width:100%; height:auto; filter: drop-shadow(0 8px 14px rgba(46,36,32,0.14)); }

  .env-label{
    font-size:1rem; font-weight:700;
    color: var(--ink);
    text-align:center; line-height:1.35;
    min-height: 2.5em;
  }

  .no-results{
    text-align:center; color:#B8A99B; font-weight:500;
    padding: 60px 20px; display:none; font-style:italic;
  }
</style>
</head>
<body>

  <div class="decor" aria-hidden="true">
    <div class="blob" style="width:340px;height:340px;top:-120px;left:-110px;"></div>
    <div class="blob" style="width:380px;height:380px;bottom:-140px;right:-120px;"></div>
  </div>

  <button class="back" id="back-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
    back
  </button>
  <div class="content">
    <div class="header">
      <h1>Open this when you…</h1>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8C4A2E" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="search-input" placeholder="Search…">
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="no-results" id="no-results">no letters match that yet, try another word</div>
  </div>

  <script src="data.js"></script>
  <script>
    const grid = document.getElementById('grid');
    LETTERS.forEach((title, i) => {
      const card = document.createElement('button');
      card.className = 'env-card';
      card.dataset.index = i;
      card.innerHTML = `${envelopeSVG()}<div class="env-label">${title}</div>`;
      card.addEventListener('click', () => goTo(`letter.html?id=${i}`));
      grid.appendChild(card);
    });
    
    document.getElementById('back-btn').addEventListener('click', () => goTo('login.html'));
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      let any = false;
      document.querySelectorAll('.env-card').forEach(card => {
        const match = LETTERS[card.dataset.index].toLowerCase().includes(q);
        card.style.display = match ? '' : 'none';
        if(match) any = true;
      });
      document.getElementById('no-results').style.display = any ? 'none' : 'block';
    });
  </script>
</body>
</html>
