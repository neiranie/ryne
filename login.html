<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
<style>
  #login-screen{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 60px 20px;
    position:relative; z-index:1;
  }
  .card{
    width:100%; max-width: 460px;
    background: var(--paper);
    border-radius: 26px;
    border: 1px solid var(--line-soft);
    box-shadow: 0 30px 60px -25px rgba(46,36,32,0.25);
    padding: 44px 40px 36px;
    position:relative;
  }
  .eyebrow{
    font-family: 'Alex Brush', cursive;
    font-size:1.5rem; 
    font-weight:400;
    letter-spacing:0.02em;
    text-transform:none;
    color: var(--accent-deep);
    text-align:center;
  }
  .card h2{
    font-family: 'Alex Brush', cursive;
    font-weight:700;
    font-size:2.9rem;
    text-align:center;
    margin: 20px 0 4px;
    color: var(--ink);
  }
  .login-eyebrow{
    font-family:'Poppins', sans-serif;
    font-size:0.72rem;
    font-weight:600;
    letter-spacing:0.22em;
    text-transform:uppercase;
  }
  .rule{
    height:1px;
    background: var(--line-soft);
    margin: 10px 0 26px;
  }

  .corner-critter{
    position:absolute;
    top:-48px; right:0px;
    width:185px;
    filter: drop-shadow(0 12px 16px rgba(46,36,32,0.25));
  }

  .field{
    display:flex; align-items:center; gap:14px;
    border: 1px solid var(--line-soft);
    border-radius: 999px;
    padding: 13px 22px;
    margin-bottom: 16px;
  }
  .field:focus-within{ border-color: var(--accent); }
  .field svg{ width:19px; height:19px; flex-shrink:0; }
  .field input{
    flex:1; border:none; outline:none;
    font-family:'Poppins', sans-serif;
    font-size:0.94rem;
    font-weight:400;
    color: var(--ink);
    background:transparent;
  }
  .field input::placeholder{ color:#B8A99B; font-style:italic; }

  .submit{
    display:block; width:100%;
    margin-top: 22px;
    background: var(--accent);
    border:none;
    border-radius: 999px;
    color:#fff;
    font-weight:600;
    font-size:0.85rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding: 13px;
    cursor:pointer;
    transition: background .2s;
  }
  .submit:hover{ background: var(--accent-deep); }

  .favorites{ margin-top: 34px; }
  .favorites .eyebrow{ text-align:left; margin-bottom:14px; }
  .fav-row{ display:flex; gap:12px; }
  .fav{
    flex:1; aspect-ratio:1/0.85;
    border-radius:16px; overflow:hidden;
    box-shadow: 0 12px 20px -10px rgba(46,36,32,0.22);
  }
  .fav img{ width:100%; height:100%; display:block; object-fit:cover; }

  /* wrong password modal */
  #modal-wrong{
    position:fixed; inset:0;
    background: rgba(46,36,32,0.4);
    backdrop-filter: blur(3px);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px; cursor:pointer;
  }
  #modal-wrong.active{ display:flex; }
  .modal-card{
    background:#fff; border-radius:24px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.35);
    padding: 38px 40px 30px;
    text-align:center; max-width:340px; width:100%;
    cursor:default;
    animation: pop .28s ease;
  }
  @keyframes pop{ 0%{ transform:scale(.92); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .modal-card .sad-photo{
    width:110px; height:110px;
    border-radius:16px;
    object-fit:cover;
    margin-bottom:16px;
    box-shadow: 0 10px 18px -8px rgba(46,36,32,0.3);
  }
  .modal-card h3{
    font-weight:600; font-size:0.88rem;
    letter-spacing:0.04em; text-transform:uppercase;
    color: var(--ink);
  }
  .modal-card .hint{
    margin-top:8px; font-size:0.75rem; font-style:italic;
    color:#B8A99B; font-weight:400;
  }
</style>
</head>
<body>

  <div class="decor" aria-hidden="true">
    <div class="blob" style="width:340px;height:340px;top:-120px;left:-110px;"></div>
    <div class="blob" style="width:380px;height:380px;bottom:-140px;right:-120px;"></div>
  </div>

  <div id="login-screen">
    <form class="card" id="login-form" autocomplete="off">
      <img class="corner-critter" alt="a red panda peeking over the card" src="assets/panda-corner.png">

      <div class="eyebrow login-eyebrow">Login</div>
      <h2>Just for you</h2>
      <div class="rule"></div>

      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8C4A2E" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <input type="text" id="username" placeholder="username" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8C4A2E" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
        <input type="password" id="password" placeholder="password" required>
      </div>

      <button type="submit" class="submit">Log in</button>

      <div class="favorites">
        <div class="eyebrow">Your Favorite</div>
        <div class="fav-row">
          <div class="fav"><img src="assets/fav1.jpg" alt="red panda favorite photo 1"></div>
          <div class="fav"><img src="assets/fav2.jpg" alt="red panda favorite photo 2"></div>
          <div class="fav"><img src="assets/fav3.jpg" alt="red panda favorite photo 3"></div>
        </div>
      </div>
    </form>
  </div>

  <div id="modal-wrong">
    <div class="modal-card">
      <img class="sad-photo" src="assets/panda-corner.jpg" alt="a sad red panda">
      <h3>Wrong password or username</h3>
      <p class="hint">tap anywhere to try again</p>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      if(u === CREDENTIALS.username && p === CREDENTIALS.password){
        goTo('letters.html');
      } else {
        document.getElementById('modal-wrong').classList.add('active');
      }
    });
    document.getElementById('modal-wrong').addEventListener('click', () => {
      document.getElementById('modal-wrong').classList.remove('active');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    });
  </script>
</body>
</html>
